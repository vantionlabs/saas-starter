# Actions only, deliberately.
#
# The npm side is pinned through `pnpm-workspace.yaml`'s catalog and tracks an
# Effect release candidate that moves weekly — a bot opening a pull request per
# bump would be noise, and `pnpm vendor` has to run alongside any Effect change
# so the vendored source stays the version that is installed. `syncpack update`
# is how that is done, by a person, in one commit.
#
# Actions are the opposite case: they are unpinned by habit, nobody watches
# them, and a stale `checkout@v5` is how a supply chain gets in.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
