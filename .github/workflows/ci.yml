name: ci

on:
  # Every branch, not just main: a boilerplate is forked and worked on in
  # branches long before anything merges, and CI that only runs on main is CI
  # that tells you after the fact.
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # bun runs everything this repository wrote. Node is here for one reason:
      # **vitest is a Node program**, and it does not survive the Bun runtime —
      # `bun --bun vitest run` dies with "Worker exited unexpectedly" whatever
      # the pool, on this many projects. Vite, Playwright and Metro are Node
      # programs too; bun invokes them, Node executes them. Pinned rather than
      # taken from the runner, so a test failure is never the runner's version.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc


      # Runs the `prepare` script, which patches TypeScript and oxlint with the
      # Effect language service.
      - run: bun install --frozen-lockfile

      - run: bun run format:check

      - run: bun run check

      - run: bun run lint

      # Dead code, mismatched versions, and secrets. Cheap enough to sit in the
      # same job rather than pay for a third install: knip walks the import
      # graph, syncpack compares every manifest against the catalog, and
      # secretlint reads the tree.
      #
      # `bun run hygiene` is the same command a person runs, so a failure here is
      # reproducible without reading this file.
      - run: bun run hygiene

      # Docker is available on ubuntu-latest, so the testcontainers-backed
      # Postgres started by test/global-setup.ts runs here rather than skipping.
      #
      # This includes the assistant's eval set: it is a Vitest project like any
      # other, so the baseline gate is part of the same command rather than a
      # job somebody can forget to add. See docs/evals.md for what that gate
      # can honestly enforce without a model key.
      - run: bun run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # bun runs everything this repository wrote. Node is here for one reason:
      # **vitest is a Node program**, and it does not survive the Bun runtime —
      # `bun --bun vitest run` dies with "Worker exited unexpectedly" whatever
      # the pool, on this many projects. Vite, Playwright and Metro are Node
      # programs too; bun invokes them, Node executes them. Pinned rather than
      # taken from the runner, so a test failure is never the runner's version.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc


      - run: bun install --frozen-lockfile

      # The browser is ~130MB and changes only when Playwright does, so it is
      # keyed on the lockfile rather than downloaded every run.
      - id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # Only the one browser the suite runs in. `--with-deps` installs the
      # system libraries the runner image does not ship, and those are not in
      # the cache — so this step runs either way and only the download is saved.
      - run: bun run --filter @vantion/e2e install-browsers:ci

      # Starts its own Postgres container on a free port, applies the
      # migrations, runs both servers, and removes the container afterwards.
      - run: bun run e2e

      - uses: actions/upload-artifact@v7
        # The report is only worth keeping when there is a failure to explain.
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  # One image, every push. The other five are nightly.
  #
  # This job exists because of a failure nothing else here could see: a root
  # `prepare` script gained a command needing `git`, which the build image does
  # not carry, and every image broke while `check` and `e2e` stayed green. The
  # next thing to notice would have been a deploy.
  #
  # The API image is the one worth paying for on every push — it builds
  # `@vantion/domain` and therefore every module, plus the database package and
  # two Vite bundles, so it exercises more of the graph than the other five put
  # together. Whether the *others* build is a question the nightly matrix
  # answers; whether a change broke images *at all* is answered here, on the
  # push that caused it.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # The layer cache is what makes this affordable. `deps` installs from a
      # fixed set of manifests, so a source-only change reuses it and the job is
      # a build rather than an install; `type=gha` keeps that across runs.
      #
      # `mode=max` caches intermediate stages too, not just the final one, which
      # for a multi-stage build is the difference between caching the install
      # and caching nothing that matters.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          # Never pushed: the question is whether it builds, and a registry
          # would need credentials this workflow has no business holding.
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
