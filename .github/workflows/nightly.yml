# The checks that are too slow to run on every push and too important to let rot.
#
# Each of these has broken at least once in this repository's short history, and
# each was found by somebody running it by hand rather than by CI: the mobile
# bundle broke on a React Native minor the Expo SDK does not pair with, and all
# six images broke at once when the root `prepare` script gained a command that
# needs `git`, which the build image does not carry.
#
# That second one is the argument for this file. `check` and `e2e` never build
# an image, so a change to a root script can break every deployment while every
# job stays green — and the next person to find out is whoever deploys.
#
# Nightly rather than per-push because together they take longer than the rest
# of CI, and a break here does not block a merge — it tells somebody the next
# morning, which for a bundle nobody ships from a pull request is the right
# trade.
name: nightly

on:
  schedule:
    # 03:00 UTC. Late enough that a day's merges are in, early enough to read
    # with coffee.
    - cron: "0 3 * * *"
  # So it can be proved to work without waiting a day.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      # bun runs everything this repository wrote. Node is here for one reason:
      # **vitest is a Node program**, and it does not survive the Bun runtime —
      # `bun --bun vitest run` dies with "Worker exited unexpectedly" whatever
      # the pool, on this many projects. Vite, Playwright and Metro are Node
      # programs too; bun invokes them, Node executes them. Pinned rather than
      # taken from the runner, so a test failure is never the runner's version.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc


      - run: bun install --frozen-lockfile

      # An Expo SDK is a matched set, and the way this breaks is a transitive
      # bump landing a React Native the SDK was not built against — which the
      # type-checker cannot see and only a bundle finds.
      # The types first, in one `tsc -b`: Metro resolves `@vantion/tokens`
      # through the `default` condition, which is built output, so bundling
      # before anything has built it fails on
      # `Cannot find module '@vantion/tokens/build/src/color.js'`. pnpm said
      # this with a `...` suffix; `tsc -b` following project references says it
      # without one.
      - run: bunx tsc -b apps/mobile/tsconfig.json
      - run: bun run --filter @vantion/mobile build

  images:
    runs-on: ubuntu-latest
    strategy:
      # One broken image should not hide the state of the others.
      fail-fast: false
      matrix:
        app: [server, web, admin, worker, marketing, brand]
    steps:
      - uses: actions/checkout@v7

      # Built from the repository root, because a workspace package resolves
      # package against the root lockfile and every sibling manifest.
      - run: docker build -f apps/${{ matrix.app }}/Dockerfile -t vantion-${{ matrix.app }} .
