name: deploy

# Applies `alchemy.run.ts`: `main` is the `prod` stage, `staging` is `staging`,
# and a pull request gets the plan for staging and nothing else.
#
# A deploy waits for `ci` rather than running it again. `workflow_run` fires
# when that workflow finishes on a push, so the change that deploys is the
# change that passed — and the tests are not paid for twice per push, which
# calling `ci.yml` from here would have done since it already runs on every
# branch.
#
# This deploys the *infrastructure*: services, variables, databases. Railway
# builds the *code* itself, from the GitHub connection each service is sourced
# from, on the same push. The two run side by side, and a push that changes
# both can start a build before the variables it needs have landed; Railway
# redeploys when a variable changes, so it converges. `docs/deploy.md` has the
# options if that stops being good enough.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main, staging]
  pull_request:
    paths:
      - alchemy.run.ts
      - tooling/DockerManifests.ts
      - apps/*/Dockerfile
      - package.json
      - bun.lock
      - .github/workflows/deploy.yml

# Read-only, the same as `ci.yml`. Nothing here writes to the repository; the
# writes go to Railway, with a token that lives in a GitHub environment.
permissions:
  contents: read

jobs:
  plan:
    # Skipped for a fork's pull request: it gets no secrets, and a plan it
    # cannot compute would read as a failing check rather than a missing one.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # The plan executes `alchemy.run.ts` from the pull request with staging's
    # credentials — anybody who can push a branch here can read them. That is
    # the price of a plan on every pull request, and the reason `production`
    # is never used for one.
    environment: staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: plan
        env: &secrets
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          ALCHEMY_STATE_DATABASE_URL: ${{ secrets.ALCHEMY_STATE_DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASSISTANT_MODEL: ${{ vars.ASSISTANT_MODEL }}
          ASSISTANT_MODEL_ID: ${{ vars.ASSISTANT_MODEL_ID }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          WEBHOOK_CONCURRENCY: ${{ vars.WEBHOOK_CONCURRENCY }}
        run: |
          set -o pipefail
          bun run deploy:plan --stage staging --no-input 2>&1 | tee plan.txt
          {
            echo '### What staging would become'
            echo '```'
            cat plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    # Only a `ci` run that passed, and only one that ran on a push. A pull
    # request's run is a `workflow_run` too, from a branch that may be a fork's.
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # `production` carries a required reviewer; `staging` does not. The secrets
    # below resolve against whichever this is, so each stage has its own.
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    # One apply per stage at a time, and never cancelled halfway: an
    # interrupted apply leaves state describing half a change. The state
    # store's advisory lock refuses a second one anyway; this queues it.
    concurrency:
      group: deploy-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The commit `ci` passed, not whatever the branch points at by now.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - run: bun install --frozen-lockfile

      - name: deploy
        env: *secrets
        run: >-
          bun run deploy
          --stage ${{ github.event.workflow_run.head_branch == 'main' && 'prod' || 'staging' }}
          --yes --no-input
