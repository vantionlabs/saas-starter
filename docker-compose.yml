services:
  postgres:
    image: postgres:17-alpine
    container_name: vantion-postgres
    environment:
      POSTGRES_DB: vantion
      # The bootstrap user is a superuser, and a superuser ignores row-level
      # security even on a FORCEd table. So it is `postgres` and nothing
      # connects as it: `init.sql` makes the two roles that do.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, when the volume is first created. After changing this file,
      # `docker compose down -v` is what makes it run again.
      - ./packages/database/src/roles/init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vantion"]
      interval: 5s
      timeout: 5s
      retries: 10

  # BullMQ's backing store. The queue degrades to in-memory without it — see
  # JobQueue.layer — so this is part of the full local stack rather than a
  # requirement for the app to start.
  redis:
    image: redis:7-alpine
    container_name: vantion-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # RULES.md leans on OTEL spans rather than manual logging, so the collector is
  # part of the default local stack. UI on http://localhost:16686.
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: vantion-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"

volumes:
  pgdata:
