packages:
  # Deployable applications.
  - apps/*
  # Libraries they share.
  - packages/*
  # One package per feature: its contract, its handlers, its stores.
  - packages/modules/*
  - scripts
  # Repo automation: the module generator and its test.
  - tooling
  # Browser tests, which drive both apps rather than importing from either.
  - e2e
  # The eval set and its baseline gate. Its own package for the same reason
  # e2e is: it drives the application rather than being part of it.
  - evals

# Effect v4 is tracked at an exact release candidate. Bumping the train means
# editing this block only — every package manifest references `catalog:`.
